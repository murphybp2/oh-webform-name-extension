<!doctype html>
<!--
  Orlando Health Form Name Reader - popup.html
  Version: 1.3.0
  Last Modified: May 11, 2026

  Changelog:
  v1.3.0 - Added warning banner + "missing" field-row state for partial results
  v1.2.3 - Left-aligned error messages; added mailto link styling
  v1.1.3 - No HTML changes (added TFAForms detection in JS)
  v1.1.2 - No HTML changes (JS improvements only)
  v1.1.1 - Bug fix for DOM loading (no HTML changes)
  v1.1.0 - Redesigned with 1Password-style click-to-copy fields
  v1.0.1 - Added separate fields with individual copy buttons
  v1.0.0 - Initial improvements with fixed encoding and better UX
-->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI",
                     Roboto, Helvetica, Arial, sans-serif;
        margin: 14px;
        width: 380px;
        background: #ffffff;
      }

      #status {
        margin-top: 6px;
        padding: 14px 16px;
        border-radius: 12px;
        background: #f6f7f9;
        font-size: 14px;
        font-weight: 500;
        line-height: 1.4;
        color: #6b7280;
        text-align: center;
        min-height: 20px;
      }

      /* Loading state */
      #status.loading {
        color: #6b7280;
      }

      /* Error state */
      #status.error {
        background: #fef2f2;
        color: #991b1b;
        font-weight: 500;
        font-size: 14px;
        text-align: left;
      }

      #status.error a {
        color: #991b1b;
        text-decoration: underline;
        word-break: break-all;
      }

      /* Warning state — partial result, one of the fields is missing */
      #status.warning {
        background: #fffbeb;
        color: #92400e;
        font-weight: 500;
        font-size: 14px;
        text-align: left;
        margin-bottom: 12px;
      }

      #status.warning a {
        color: #92400e;
        text-decoration: underline;
        word-break: break-all;
      }

      /* Form fields container - hidden until data loads */
      #form-data {
        display: none;
        margin-top: 12px;
      }

      #form-data.visible {
        display: block;
      }

      .field-row {
        position: relative;
        margin-bottom: 8px;
        padding: 12px 16px;
        border-radius: 8px;
        background: #ffffff;
        border: 1px solid #e5e7eb;
        cursor: pointer;
        transition: all 0.15s ease;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .field-row:hover {
        background: #eff6ff;
        border-color: #93c5fd;
      }

      .field-row:active {
        background: #dbeafe;
      }

      .field-row.copied {
        background: #f0fdf4;
        border-color: #86efac;
      }

      /* Field with no value to copy (input missing or empty) */
      .field-row.missing,
      .field-row.missing:hover,
      .field-row.missing:active {
        background: #f9fafb;
        border-color: #e5e7eb;
        cursor: default;
      }

      .field-row.missing .field-value {
        color: #9ca3af;
        font-style: italic;
        font-weight: 400;
      }

      .field-row.missing .copy-indicator {
        display: none;
      }

      .field-content {
        flex: 1;
        min-width: 0;
      }

      .field-label {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: #6b7280;
        margin-bottom: 4px;
      }

      .field-value {
        font-size: 15px;
        font-weight: 500;
        color: #1f2937;
        word-break: break-word;
        line-height: 1.3;
      }

      .copy-indicator {
        opacity: 0;
        font-size: 13px;
        font-weight: 500;
        color: #3b82f6;
        white-space: nowrap;
        margin-left: 12px;
        transition: opacity 0.15s ease;
      }

      .field-row:hover .copy-indicator {
        opacity: 1;
      }

      .field-row.copied .copy-indicator {
        color: #16a34a;
        opacity: 1;
      }

      .hint {
        font-size: 12px;
        color: #6b7280;
        margin-top: 12px;
        line-height: 1.5;
      }

      .hint code {
        background: #f3f4f6;
        padding: 2px 4px;
        border-radius: 3px;
        font-family: 'Courier New', monospace;
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <div id="status" class="loading">Reading...</div>

    <div id="form-data">
      <div class="field-row" id="name-field" data-value="">
        <div class="field-content">
          <div class="field-label">Form Name</div>
          <div class="field-value" id="form-name-value"></div>
        </div>
        <div class="copy-indicator">Copy</div>
      </div>

      <div class="field-row" id="id-field" data-value="">
        <div class="field-content">
          <div class="field-label">Form ID</div>
          <div class="field-value" id="form-id-value"></div>
        </div>
        <div class="copy-indicator">Copy</div>
      </div>
    </div>

    <div class="hint">
      Reads <code>Form Name</code> and <code>FormId</code> from Orlando Health forms.
    </div>

    <script src="popup.js"></script>
  </body>
</html>
